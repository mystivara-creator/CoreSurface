name: CoreSurface CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ShellCheck, JS Check & Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ShellCheck availability
        run: shellcheck --version

      - name: Lint all POSIX shell scripts
        run: |
          shellcheck -s sh -x \
            customize.sh \
            post-fs-data.sh \
            service.sh \
            uninstall.sh \
            lib/*.sh \
            scripts/*.sh \
            tests/*.sh

      - name: Validate WebUI JavaScript syntax
        run: node --check webroot/app.js

      - name: Run host unit tests
        run: sh tests/run_tests.sh

  package:
    name: Build Clean-Room RRO, Luminous Engine & CoreSurface-v1.0.0.zip
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean-room RRO overlays, CoreSurfaceEngine.apk & production ZIP
        run: sh scripts/package.sh

      - name: Verify ZIP checksum and contents
        run: |
          unzip -l dist/CoreSurface-v1.0.0.zip
          (cd dist && sha256sum -c CoreSurface-v1.0.0.zip.sha256)

      - name: Upload CoreSurface-v1.0.0.zip & CoreSurfaceEngine.apk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoreSurface-v1.0.0
          path: |
            dist/CoreSurface-v1.0.0.zip
            dist/CoreSurface-v1.0.0.zip.sha256
            dist/CoreSurfaceEngine.apk
          if-no-files-found: error
          retention-days: 30

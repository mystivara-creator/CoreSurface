name: CoreSurface CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ShellCheck, JS Check & Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ShellCheck availability
        run: shellcheck --version

      - name: Lint all POSIX shell scripts
        run: |
          shellcheck -s sh -x \
            customize.sh \
            post-fs-data.sh \
            service.sh \
            action.sh \
            uninstall.sh \
            lib/*.sh \
            scripts/*.sh \
            tests/*.sh

      - name: Validate WebUI JavaScript syntax
        run: node --check webroot/app.js

      - name: Run host unit tests
        run: sh tests/run_tests.sh

  package:
    name: Build Clean-Room RRO, Flagship Motion Engine & CoreSurface-v1.1.0.zip
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore persistent Engine APK signing keystore cache (fallback when secret unset)
        uses: actions/cache@v4
        with:
          path: ~/.coresurface-signing
          key: coresurface-engine-signing-v1

      - name: Configure persistent Engine APK signing identity
        env:
          KEYSTORE_B64: ${{ secrets.CORESURFACE_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.CORESURFACE_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.CORESURFACE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CORESURFACE_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/coresurface-engine.jks"
            chmod 0600 "$RUNNER_TEMP/coresurface-engine.jks"
            echo "CORESURFACE_KEYSTORE=$RUNNER_TEMP/coresurface-engine.jks" >> "$GITHUB_ENV"
            [ -n "$KEYSTORE_PASS" ] && echo "CORESURFACE_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            [ -n "$KEY_ALIAS" ] && echo "CORESURFACE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            [ -n "$KEY_PASS" ] && echo "CORESURFACE_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
            echo "Using release signing keystore from GitHub Actions secret."
          else
            mkdir -p "$HOME/.coresurface-signing"
            echo "CORESURFACE_KEYSTORE=$HOME/.coresurface-signing/coresurface-engine.jks" >> "$GITHUB_ENV"
            echo "CORESURFACE_KEY_ALIAS=coresurface_engine" >> "$GITHUB_ENV"
            echo "Using persistent cached CI signing keystore (preserves LSPosed state across updates)."
          fi

      - name: Build clean-room RRO overlays, CoreSurfaceEngine.apk & production ZIP
        run: sh scripts/package.sh

      - name: Verify ZIP checksum and contents
        run: |
          unzip -l dist/CoreSurface-v1.1.0.zip
          (cd dist && sha256sum -c CoreSurface-v1.1.0.zip.sha256)

      - name: Upload CoreSurface-v1.1.0.zip & CoreSurfaceEngine.apk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoreSurface-v1.1.0
          path: |
            dist/CoreSurface-v1.1.0.zip
            dist/CoreSurface-v1.1.0.zip.sha256
            dist/CoreSurfaceEngine.apk
          if-no-files-found: error
          retention-days: 30

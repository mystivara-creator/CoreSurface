name: Bug report
description: Laporkan masalah disertai bukti aman
labels: [bug]
body:
  - type: input
    id: build
    attributes:
      label: Build ID / ROM
      placeholder: 16OS3.1...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Hasil aktual dan ekspektasi
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log yang telah disunting (tanpa IMEI/serial/token)

name: Validate and package preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and mock OEM XML install
        run: python3 scripts/validate.py
  package:
    needs: static
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build preview ZIP
        run: python3 scripts/package.py
      - name: Verify artifact
        run: python3 scripts/verify_artifact.py
      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Kunzite-Capability-Suite-v0.6.5-preview
          path: |
            dist/kunzite_capability_suite_v0.6.5-preview.zip
            dist/kunzite_capability_suite_v0.6.5-preview.zip.sha256
          if-no-files-found: error
          retention-days: 30
